services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: roast
      POSTGRES_PASSWORD: roast
      POSTGRES_DB: roastlog
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roast -d roastlog"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://roast:roast@db:5432/roastlog
      ROR_WINDOW_S: "30"
      MAX_INTERP_GAP_S: "12"
      SEED_ON_STARTUP: "true"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
